name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag, package versions and bilingual release notes
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:prepare
      - name: Full release gate
        run: pnpm check:ci --browser-deps
      - name: Pack the publish artifacts
        run: |
          for pkg in core functions backend cli mcp; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../.release)
          done
          cp .node-version .release/.node-version
      - name: Verify the exact publish artifacts
        run: pnpm pack:check --artifacts .release --browser-deps
      - name: Record artifact checksums
        working-directory: .release
        run: sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      # No checkout, dependency install, build, test or project script in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: .release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .release/.node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Setup trusted-publishing CLI without lifecycle scripts
        run: npm install --global --ignore-scripts npm@11
      - name: Verify artifact checksums
        working-directory: .release
        run: sha256sum --check SHA256SUMS
      - name: Publish verified tarballs to npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          for pkg in core functions backend cli mcp; do
            if npm view "@openfairygui/$pkg@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: @openfairygui/$pkg@$version"
            else
              npm publish --ignore-scripts --provenance --access public --tag "$dist_tag" ".release/openfairygui-$pkg-$version.tgz"
            fi
          done
      - name: Publish verified tarballs to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/github-packages.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc"
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          for pkg in core functions backend cli mcp; do
            if npm view "@openfairygui/$pkg@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Already published: @openfairygui/$pkg@$version"
            else
              npm publish --ignore-scripts --tag "$dist_tag" --registry=https://npm.pkg.github.com ".release/openfairygui-$pkg-$version.tgz"
            fi
          done
      - name: Create or update the bilingual GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file .release/release-notes.md --prerelease="$prerelease"
            gh release upload "$RELEASE_TAG" .release/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" .release/*.tgz --verify-tag --title "$RELEASE_TAG" --notes-file .release/release-notes.md --prerelease="$prerelease"
          fi
