name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag, package versions and bilingual release notes
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm release:prepare
      - name: Build and pack the exact publish artifacts
        run: |
          pnpm build
          for pkg in core functions backend cli mcp; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../.release)
          done
          cp .node-version .release/.node-version
      - name: Full release gate on the exact publish artifacts
        run: pnpm check:ci --artifacts .release --browser-deps
      - name: Record artifact checksums
        working-directory: .release
        run: sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      # No checkout, dependency install, build, test or project script in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: .release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .release/.node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Setup trusted-publishing CLI without lifecycle scripts
        run: npm install --global --ignore-scripts npm@^11.21.0
      - name: Verify artifact checksums
        working-directory: .release
        run: sha256sum --check SHA256SUMS
      - name: Prepare dist-tag comparison helper
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/compare-next-tag.mjs"
          const [rawTags, target] = process.argv.slice(2);
          const tags = JSON.parse(rawTags);
          if (!tags || typeof tags !== 'object' || Array.isArray(tags)) {
            throw new Error('Invalid dist-tags response');
          }
          const current = tags.next;
          if (current === undefined) {
            console.log('update');
            process.exit(0);
          }
          if (typeof current !== 'string' || !current) {
            throw new Error(`Invalid next dist-tag: ${String(current)}`);
          }
          const parse = (value) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+.*)?$/.exec(value);
            if (!match) throw new Error(`Invalid semver: ${value}`);
            return {
              nums: [Number(match[1]), Number(match[2]), Number(match[3])],
              pre: match[4] ? match[4].split('.') : [],
            };
          };
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let i = 0; i < 3; i++) if (a.nums[i] !== b.nums[i]) return a.nums[i] - b.nums[i];
            if (!a.pre.length && !b.pre.length) return 0;
            if (!a.pre.length) return 1;
            if (!b.pre.length) return -1;
            for (let i = 0; i < Math.max(a.pre.length, b.pre.length); i++) {
              const ai = a.pre[i];
              const bi = b.pre[i];
              if (ai === undefined) return -1;
              if (bi === undefined) return 1;
              const an = /^\d+$/.test(ai);
              const bn = /^\d+$/.test(bi);
              if (an && bn && Number(ai) !== Number(bi)) return Number(ai) - Number(bi);
              if (an !== bn) return an ? -1 : 1;
              if (ai !== bi) return ai < bi ? -1 : 1;
            }
            return 0;
          };
          console.log(compare(current, target) < 0 ? 'update' : `keep:${current}`);
          EOF
      - name: Publish verified tarballs to npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          for pkg in core functions backend cli mcp; do
            if npm view "@openfairygui/$pkg@$version" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: @openfairygui/$pkg@$version"
            else
              npm publish --ignore-scripts --provenance --access public --tag "$dist_tag" ".release/openfairygui-$pkg-$version.tgz"
            fi
          done
          if [[ "$dist_tag" == "latest" ]]; then
            for pkg in core functions backend cli mcp; do
              dist_tags_json=""
              for attempt in $(seq 1 6); do
                if dist_tags_json="$(npm view "@openfairygui/$pkg" dist-tags --json --registry=https://registry.npmjs.org 2>/dev/null)" && [[ -n "$dist_tags_json" ]]; then
                  break
                fi
                echo "Waiting for npm dist-tags view for @openfairygui/$pkg (attempt $attempt/6)"
                sleep 5
              done
              decision="$(node "$RUNNER_TEMP/compare-next-tag.mjs" "$dist_tags_json" "$version")"
              if [[ "$decision" == "update" ]]; then
                npm dist-tag add "@openfairygui/$pkg@$version" next --registry=https://registry.npmjs.org
              else
                echo "Keeping npm next dist-tag for @openfairygui/$pkg: ${decision#keep:}"
              fi
            done
          fi
      - name: Verify published npm dist-tags
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          for pkg in core functions backend cli mcp; do
            verified=false
            for attempt in $(seq 1 12); do
              dist_tags_json="$(npm view "@openfairygui/$pkg" dist-tags --json --registry=https://registry.npmjs.org)"
              if node -e '
                const [raw, tag, ver] = process.argv.slice(1);
                const tags = JSON.parse(raw);
                process.exit(tags && typeof tags === "object" && tags[tag] === ver ? 0 : 1);
              ' "$dist_tags_json" "$dist_tag" "$version"; then
                if [[ "$dist_tag" != "latest" ]] || [[ "$(node "$RUNNER_TEMP/compare-next-tag.mjs" "$dist_tags_json" "$version")" != "update" ]]; then
                  echo "@openfairygui/$pkg dist-tags verified: $dist_tags_json"
                  verified=true
                  break
                fi
              fi
              echo "Waiting for npm dist-tags propagation for @openfairygui/$pkg (attempt $attempt/12): $dist_tags_json"
              sleep 10
            done
            if [[ "$verified" != "true" ]]; then
              echo "Failed to verify npm dist-tags for @openfairygui/$pkg@$version" >&2
              exit 1
            fi
          done
      - name: Publish verified tarballs to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$RUNNER_TEMP/github-packages.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github-packages.npmrc"
          version="${RELEASE_TAG#v}"
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          for pkg in core functions backend cli mcp; do
            if npm view "@openfairygui/$pkg@$version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
              echo "Already published: @openfairygui/$pkg@$version"
            else
              npm publish --ignore-scripts --tag "$dist_tag" --registry=https://npm.pkg.github.com ".release/openfairygui-$pkg-$version.tgz"
            fi
          done
          if [[ "$dist_tag" == "latest" ]]; then
            for pkg in core functions backend cli mcp; do
              dist_tags_json=""
              for attempt in $(seq 1 6); do
                if dist_tags_json="$(npm view "@openfairygui/$pkg" dist-tags --json --registry=https://npm.pkg.github.com 2>/dev/null)" && [[ -n "$dist_tags_json" ]]; then
                  break
                fi
                echo "Waiting for GitHub Packages dist-tags view for @openfairygui/$pkg (attempt $attempt/6)"
                sleep 5
              done
              decision="$(node "$RUNNER_TEMP/compare-next-tag.mjs" "$dist_tags_json" "$version")"
              if [[ "$decision" == "update" ]]; then
                npm dist-tag add "@openfairygui/$pkg@$version" next --registry=https://npm.pkg.github.com
              else
                echo "Keeping GitHub Packages next dist-tag for @openfairygui/$pkg: ${decision#keep:}"
              fi
            done
          fi
      - name: Create or update the bilingual GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file .release/release-notes.md --prerelease="$prerelease"
            gh release upload "$RELEASE_TAG" .release/*.tgz .release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" .release/*.tgz .release/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes-file .release/release-notes.md --prerelease="$prerelease"
          fi
