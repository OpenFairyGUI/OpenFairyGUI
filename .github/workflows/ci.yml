name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup development Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Classify changes using the impact map
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/test-changed.mjs --base "$BASE_SHA" --list > "$RUNNER_TEMP/ci-scope.json"
          cat "$RUNNER_TEMP/ci-scope.json"
          docs_only=$(jq -r '.scope == "repository-only"' "$RUNNER_TEMP/ci-scope.json")
          echo "docs-only=$docs_only" >> "$GITHUB_OUTPUT"

  quality:
    name: Repository checks (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full repository checks
        if: matrix.os != 'ubuntu-latest' || matrix.node != 22
        run: pnpm check

      - name: Full repository checks with coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm coverage

      - name: Upload coverage
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-node22-linux
          path: coverage/
          if-no-files-found: error

  documentation:
    name: Guidance and documentation
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup development Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository script checks for documentation-only changes
        if: needs.changes.result == 'success' && needs.changes.outputs.docs-only == 'true'
        run: node --test scripts/repository.test.mjs

      - name: Verify instructions, links and bilingual structure
        run: pnpm docs:check

      - name: Build documentation including API
        run: pnpm docs:build

  consumer:
    name: Installed consumer (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs-only != 'true') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup development Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify packed consumers and real Chromium storage
        run: pnpm pack:check --browser-deps

  gate:
    name: CI Gate
    needs: [changes, quality, documentation, consumer]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI results
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
        run: |
          set -euo pipefail
          echo "event=$EVENT_NAME changes=$CHANGES_RESULT docs_only=$DOCS_ONLY quality=$QUALITY_RESULT documentation=$DOCS_RESULT consumer=$CONSUMER_RESULT"
          if [[ "$EVENT_NAME" == "pull_request" && "$CHANGES_RESULT" != "success" ]]; then
            echo "Change scope job did not succeed ($CHANGES_RESULT)." >&2
            exit 1
          fi
          if [[ "$DOCS_RESULT" != "success" ]]; then
            echo "Documentation job did not succeed ($DOCS_RESULT)." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$CHANGES_RESULT" == "success" && "$DOCS_ONLY" == "true" ]]; then
            if [[ "$QUALITY_RESULT" != "skipped" && "$QUALITY_RESULT" != "success" ]]; then
              echo "Quality job failed ($QUALITY_RESULT)." >&2
              exit 1
            fi
            if [[ "$CONSUMER_RESULT" != "skipped" && "$CONSUMER_RESULT" != "success" ]]; then
              echo "Consumer job failed ($CONSUMER_RESULT)." >&2
              exit 1
            fi
          else
            if [[ "$QUALITY_RESULT" != "success" ]]; then
              echo "Quality job did not succeed ($QUALITY_RESULT)." >&2
              exit 1
            fi
            if [[ "$CONSUMER_RESULT" != "success" ]]; then
              echo "Consumer job did not succeed ($CONSUMER_RESULT)." >&2
              exit 1
            fi
          fi
